# Observability first: the settings the scripts expect. Read docs/observability.md before you copy them to production.
listen_addresses = '*'
shared_preload_libraries = 'pg_stat_statements, pg_wait_sampling, pg_stat_kcache, auto_explain'
compute_query_id = on
track_io_timing = on
track_wal_io_timing = on
track_functions = all
pg_stat_statements.track = top
pg_stat_statements.max = 10000

# auto_explain: plans of slow statements land in the log, with buffers and timing
auto_explain.log_min_duration = '500ms'
auto_explain.log_analyze = on
auto_explain.log_buffers = on
auto_explain.log_timing = off      # per-node timing is the expensive part; turn it on for a session if you need it

# logging that pays for itself
log_min_duration_statement = '1s'
log_lock_waits = on
log_temp_files = 0
log_checkpoints = on
log_autovacuum_min_duration = '10s'
log_line_prefix = '%m [%p] user=%u,db=%d,app=%a,client=%h,qid=%Q '

# small lab box: 1-2 GB of RAM is enough for the demos
shared_buffers = '512MB'
maintenance_work_mem = '512MB'
work_mem = '16MB'
